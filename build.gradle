plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Embeds a WebSocket server directly in the client (no built-in JDK
    // WebSocket server exists) -- this is minebot's local control channel
    // to the Python backend, not exposed to the internet. `include` bundles
    // it into the mod jar (Loom's jar-in-jar) since players/other mods
    // won't have this on their classpath otherwise.
    include implementation('org.java-websocket:Java-WebSocket:1.5.7')

    // Minecraft itself bundles Gson at runtime, but not as a Loom-visible
    // dependency for compilation -- declare it explicitly (not `include`d,
    // since it's already on the real runtime classpath) purely so the
    // compiler can see it.
    compileOnly 'com.google.code.gson:gson:2.10.1'

    // Config screen, shown via the ModMenu mod-list button -- compileOnly
    // since it's optional (declared as "suggests" not "depends" in
    // fabric.mod.json): the mod works fine without ModMenu installed, it
    // just has no in-game way to reach the config screen then.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

// Bakes the current git commit + build time into the jar so the running
// mod can report exactly what code it's actually running -- added after
// a real live-debugging session where a jar had been rebuilt with a fix
// but the *running* client hadn't been restarted to pick it up, and
// there was no way from the Python side's logs alone to tell "stale
// client" apart from "the fix doesn't work". MinebotMod broadcasts this
// on every control-channel connect (see broadcastHelloEvent); the
// backend logs it and can compare it against `git rev-parse HEAD` for
// this repo to catch the same class of bug automatically going forward.
tasks.register("generateBuildInfo") {
    def outputDir = layout.buildDirectory.dir("generated/buildInfo")
    outputs.dir(outputDir)
    doLast {
        def commit = providers.exec {
            commandLine "git", "rev-parse", "HEAD"
        }.standardOutput.asText.get().trim()
        def dirty = providers.exec {
            commandLine "git", "status", "--porcelain"
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        def props = new File(outputDir.get().asFile, "minebot-mod-build-info.properties")
        props.parentFile.mkdirs()
        props.text = """\
commit=${commit}${dirty ? "-dirty" : ""}
built_at=${new Date().toInstant()}
"""
    }
}
sourceSets.main.resources.srcDir(tasks.generateBuildInfo)
processResources.dependsOn(tasks.generateBuildInfo)

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
