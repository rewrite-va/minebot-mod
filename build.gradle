plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

// Passes -Dminebot.bootstrapTestWorld=<name> through to the actual forked
// client JVM when invoked as `./gradlew runClient -Pminebot.bootstrapTestWorld=<name>`
// -- see TestWorldBootstrap's own docstring for what this triggers.
// Gradle project properties (-P) are build-script-only; they don't reach
// the forked game process on their own the way a real system property
// does, confirmed live (a first attempt with just -P and no
// loom.runConfigs wiring never reached TestWorldBootstrap's
// System.getProperty check at all).
// Boots straight into a world (skipping the main menu) when invoked as
// `./gradlew runClient -Pminebot.quickPlayWorld=<name>` -- see TESTING.md's
// own "Headless launch" section for why this + a real WSLg display (NOT
// xvfb-run, see TESTING.md for why that was tried and rejected) is the
// in-game test harness launch strategy.
loom.runConfigs.client {
    if (project.hasProperty("minebot.bootstrapTestWorld")) {
        property("minebot.bootstrapTestWorld", project.property("minebot.bootstrapTestWorld").toString())
    }
    if (project.hasProperty("minebot.quickPlayWorld")) {
        programArgs("--quickPlaySingleplayer", project.property("minebot.quickPlayWorld").toString())
    }
    // Overrides ControlClient's own hardcoded default port -- see
    // MinebotMod.onInitializeClient's own comment. Needed so the pytest
    // integration driver (minebot repo's tests/integration/) can run its
    // own disposable ModBridge without colliding with the always-running
    // dev backend's control channel on the default port.
    if (project.hasProperty("minebot.controlPort")) {
        property("minebot.controlPort", project.property("minebot.controlPort").toString())
    }
    // Enables LegsNavigateNode's own every-tick navigate/collision debug
    // logging (normally sampled every 10th tick only -- see
    // LegsNavigateNode.DEBUG_NAVIGATE's own docstring) when invoked as
    // `./gradlew runClient -Pminebot.debugNavigate=true`. Same forwarding
    // shape as bootstrapTestWorld/controlPort above -- a Gradle project
    // property alone never reaches the forked game process; it has to be
    // re-declared as a real system property here.
    if (project.hasProperty("minebot.debugNavigate")) {
        property("minebot.debugNavigate", project.property("minebot.debugNavigate").toString())
    }
    // This machine has both an integrated AMD GPU and a discrete NVIDIA
    // RTX 4090 (confirmed via `nvidia-smi`, real, visible from WSL2 --
    // `/dev/dxg` present). WSLg's Mesa D3D12 Gallium driver defaulted to
    // the AMD adapter, which was unstable under real gameplay load --
    // confirmed live, repeatedly: every launch on the default adapter
    // crashed 50-60s after successfully logging into the world, with
    // three DIFFERENT crash signatures across attempts (GL_OUT_OF_MEMORY
    // in glBufferStorage, a real GpuOutOfMemoryException during texture
    // upload, and a native SIGSEGV inside Mesa's own software rasterizer
    // swrast_dri.so) -- all inside vanilla/Mesa's own code, never this
    // mod's, and all with the same ~1-minute-after-login timing
    // regardless of which specific crash. Forcing the actual NVIDIA
    // adapter via MESA_D3D12_DEFAULT_ADAPTER_NAME fixed it outright: the
    // very next launch ran the full length of a 180s test window with no
    // crash, no error, real chunk/UBO rendering happening the whole time.
    // Set unconditionally (not just for test launches) since there's no
    // known downside to targeting the real GPU for a normal dev
    // `runClient` either.
    environmentVariable("MESA_D3D12_DEFAULT_ADAPTER_NAME", "NVIDIA")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Embeds a WebSocket server directly in the client (no built-in JDK
    // WebSocket server exists) -- this is minebot's local control channel
    // to the Python backend, not exposed to the internet. `include` bundles
    // it into the mod jar (Loom's jar-in-jar) since players/other mods
    // won't have this on their classpath otherwise.
    include implementation('org.java-websocket:Java-WebSocket:1.5.7')

    // Minecraft itself bundles Gson at runtime, but not as a Loom-visible
    // dependency for compilation -- declare it explicitly (not `include`d,
    // since it's already on the real runtime classpath) purely so the
    // compiler can see it.
    compileOnly 'com.google.code.gson:gson:2.10.1'

    // Config screen, shown via the ModMenu mod-list button -- compileOnly
    // since it's optional (declared as "suggests" not "depends" in
    // fabric.mod.json): the mod works fine without ModMenu installed, it
    // just has no in-game way to reach the config screen then.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

// Bakes the current git commit + build time into the jar so the running
// mod can report exactly what code it's actually running -- added after
// a real live-debugging session where a jar had been rebuilt with a fix
// but the *running* client hadn't been restarted to pick it up, and
// there was no way from the Python side's logs alone to tell "stale
// client" apart from "the fix doesn't work". MinebotMod broadcasts this
// on every control-channel connect (see broadcastHelloEvent); the
// backend logs it and can compare it against `git rev-parse HEAD` for
// this repo to catch the same class of bug automatically going forward.
tasks.register("generateBuildInfo") {
    def outputDir = layout.buildDirectory.dir("generated/buildInfo")
    outputs.dir(outputDir)
    // The whole point is to capture the *current* commit/dirty-state/
    // timestamp on every build -- none of which Gradle can see as a
    // changed "input" (the task has no declared inputs at all), so
    // without this it ran once, then was considered UP-TO-DATE forever
    // after, silently baking in a stale commit on every later build
    // (found immediately after adding this task: a rebuild right after
    // a new commit still reported the previous one).
    outputs.upToDateWhen { false }
    doLast {
        def commit = providers.exec {
            commandLine "git", "rev-parse", "HEAD"
        }.standardOutput.asText.get().trim()
        def dirty = providers.exec {
            commandLine "git", "status", "--porcelain"
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        def props = new File(outputDir.get().asFile, "minebot-mod-build-info.properties")
        props.parentFile.mkdirs()
        props.text = """\
commit=${commit}${dirty ? "-dirty" : ""}
built_at=${new Date().toInstant()}
"""
    }
}
sourceSets.main.resources.srcDir(tasks.generateBuildInfo)
processResources.dependsOn(tasks.generateBuildInfo)

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
